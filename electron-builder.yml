appId: kr.moru.app
productName: moru
copyright: Copyright © 2026 Jinseong Park
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
  - '!**/*.map'
asarUnpack:
  - node_modules/node-pty/**
  - node_modules/@vscode/ripgrep/bin/**
  - node_modules/@parcel/watcher*/**
npmRebuild: false
publish: null
mac:
  category: public.app-category.developer-tools
  target: [dmg, zip]
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: null
dmg:
  sign: false
win:
  target: [nsis, zip]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
